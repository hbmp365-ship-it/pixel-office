name: Deploy to Cloudflare

# Publishes the office to https://pixel-office.<account>.workers.dev.
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        run: npm run build
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
